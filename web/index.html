<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Sonic Nexus Web - RSDKv2</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #111;
            color: #fff;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        #container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }
        canvas {
            border: 2px solid #333;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        #status { color: #aaa; font-size: 14px; min-height: 20px; }
        #log {
            background: #000;
            color: #0f0;
            font-family: monospace;
            font-size: 11px;
            width: 640px;
            height: 200px;
            overflow-y: auto;
            padding: 8px;
            border: 1px solid #333;
            white-space: pre-wrap;
            word-break: break-all;
        }
        #controls {
            color: #888;
            font-size: 12px;
            text-align: center;
            line-height: 1.6;
        }
        .btn {
            background: #333;
            color: #fff;
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }
        .btn:hover { background: #555; }
        #load-screen {
            text-align: center;
            padding: 40px;
        }
        #load-screen h2 { margin-bottom: 16px; }
    </style>
</head>
<body>
    <div id="container">
        <div id="load-screen">
            <h2>Sonic Nexus Web</h2>
            <p style="color:#aaa;margin-bottom:16px">Select your Data.bin file from Sonic Nexus 2008</p>
            <label class="btn" for="dataFileInput">Load Data.bin</label>
            <input type="file" id="dataFileInput" accept=".bin,.pak,.rsdk,*" style="display:none">
            <p id="status" style="margin-top:12px"></p>
        </div>
        <div id="game-area" style="display:none"></div>
        <div id="log"></div>
        <div id="controls">
            Arrow Keys: Move | A/Z: Jump | S/X: Attack | D/C: Special | Enter: Start
        </div>
    </div>

    <script>
        var logEl = document.getElementById('log');
        function log(msg) {
            var line = document.createElement('div');
            line.textContent = '[' + new Date().toLocaleTimeString() + '] ' + msg;
            logEl.appendChild(line);
            logEl.scrollTop = logEl.scrollHeight;
            console.log(msg);
        }

        log('Page loaded, waiting for Data.bin...');

        var dataBuffer = null;
        var engineStarted = false;

        document.getElementById('dataFileInput').addEventListener('change', function(e) {
            var file = e.target.files[0];
            if (!file) { log('No file selected'); return; }
            log('File selected: ' + file.name + ' (' + (file.size / 1024 / 1024).toFixed(1) + 'MB)');

            var reader = new FileReader();
            reader.onload = function(ev) {
                dataBuffer = new Uint8Array(ev.target.result);
                log('File read complete: ' + dataBuffer.length + ' bytes');
                startEngine();
            };
            reader.onerror = function() { log('ERROR: FileReader failed'); };
            reader.readAsArrayBuffer(file);
        });

        function startEngine() {
            if (engineStarted) { log('Engine already started, skipping'); return; }
            engineStarted = true;
            log('Starting engine...');

            // Resume AudioContext on user gesture
            try {
                var AC = window.AudioContext || window.webkitAudioContext;
                if (AC) {
                    var ctx = new AC();
                    if (ctx.state === 'suspended') { ctx.resume(); log('AudioContext resumed'); }
                    ctx.close();
                }
            } catch(e) { log('AudioContext init: ' + e.message); }

            document.getElementById('load-screen').style.display = 'none';
            var gameArea = document.getElementById('game-area');
            gameArea.style.display = 'block';

            var canvas = document.createElement('canvas');
            canvas.width = 640;
            canvas.height = 480;
            canvas.id = 'canvas';
            gameArea.appendChild(canvas);
            log('Canvas created: 640x480');

            // Define Module BEFORE loading RSDKv2.js
            window.Module = {
                canvas: canvas,
                preRun: [function() {
                    log('preRun: Writing Data.bin to MEMFS...');
                    try {
                        var fs = (typeof FS !== 'undefined') ? FS : Module.FS;
                        if (!fs) { log('preRun ERROR: FS not available'); return; }
                        fs.writeFile('/Data.bin', dataBuffer);
                        log('preRun: Data.bin written OK (' + dataBuffer.length + ' bytes)');
                    } catch(err) {
                        log('preRun ERROR: ' + err.message + ' | ' + err.stack);
                    }
                }],
                print: function(text) { log('[ENGINE] ' + text); },
                printErr: function(text) { log('[ERROR] ' + text); },
                onAbort: function(what) { log('[ABORT] ' + what); },
                onRuntimeInitialized: function() {
                    log('Runtime initialized');
                }
            };
            log('Module defined, loading RSDKv2.js...');

            var script = document.createElement('script');
            script.src = 'RSDKv2.js';
            script.onload = function() {
                log('RSDKv2.js loaded');
                // Aggressively resume AudioContext on any user event
                ['click','keydown','mousedown','touchstart'].forEach(function(evt) {
                    document.addEventListener(evt, function resumeAudio() {
                        try {
                            if (Module.SDL2 && Module.SDL2.audioContext && Module.SDL2.audioContext.state === 'suspended') {
                                Module.SDL2.audioContext.resume();
                                log('SDL2 AudioContext resumed via ' + evt);
                            }
                        } catch(e) {}
                    }, { once: false });
                });
            };
            script.onerror = function() { log('ERROR: Failed to load RSDKv2.js'); };
            document.body.appendChild(script);
        }
    </script>
</body>
</html>
